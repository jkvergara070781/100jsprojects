<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
    <title>Image Slider</title>
  </head>
  <body>
    <div class="slider-container">
      <div class="image-container">
        <img src="https://picsum.photos/id/50/500/300" alt="image" />
        <img src="https://picsum.photos/id/26/500/300" alt="image" />
        <img src="https://picsum.photos/id/94/500/300" alt="image" />
        <img src="https://picsum.photos/id/88/500/300" alt="image" />
        <img src="https://picsum.photos/id/117/500/300" alt="image" />
        <img src="https://picsum.photos/id/201/500/300" alt="image" />
      </div>
      <i class="fa-solid fa-angles-left btn prev"></i>
      <i class="fa-solid fa-angles-right btn next"></i>
    </div>

    <script src="script.js"></script>
  </body>
</html>
